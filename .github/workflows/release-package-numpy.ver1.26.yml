
name: Release Package

on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - 'setup-numpy.ver1.26.py'
      - 'pyproject-numpy.ver1.26.toml'
      - 'requirements-numpy.ver1.26.txt'
      - '.github/workflows/release-package-numpy.ver1.26.yml'


jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        # MATRIX FOR A PURE LIBS ISN'T REALLY NECESSARY

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set release version
      run: |
        echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
        
        # move the specific version implementations to be used
        rm requirements.txt
        rm setup.py
        mv requirements-numpy.ver1.26.txt requirements.txt
        mv setup-numpy.ver1.26.py setup.py
        rm pyproject.toml 
        mv pyproject-numpy.ver1.26.toml pyproject.toml
    - name: Install dependencies
      run: |
        echo "release ${{ env.RELEASE_VERSION }}"
        python -m pip install --upgrade pip
        python -m pip install build toml-cli
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Build package
      run: |
        VERSION=$(toml get --toml-path pyproject.toml project.version)
        echo "WHEEL_VERSION=${VERSION}" >> $GITHUB_ENV
        #python setup.py sdist bdist_wheel
        python -m build --wheel
        # produces pygeom-${{ env.WHEEL_VERSION }}-py3-none-any.whl
        
        
        mv ./dist/pygeom-${VERSION}-py3-none-any.whl ./pygeom-${VERSION}-py3-none-any-numpy.ver1.26.whl 
        #ls -l .  
        zip -r pygeom-${VERSION}-scripts-numpy.ver1.26.zip ./scripts pygeom-${VERSION}-py3-none-any-numpy.ver1.26.whl 
        
        
          
    - name:  Release Asset
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        #upload_url: ${{ steps.create_release.outputs.upload_url }} 
        # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
        files: |
          ./pygeom-${{ env.WHEEL_VERSION }}-py3-none-any-numpy.ver1.26.whl 
          ./pygeom-${{ env.WHEEL_VERSION }}-scripts-numpy.ver1.26.zip
          
        draft: false
        tag_name: ${{ env.RELEASE_VERSION }}
        prerelease: false
        
        name: pygeom-${{ env.WHEEL_VERSION }}-py3-none-any-numpy.ver1.26.whl 
        overwrite_files: true